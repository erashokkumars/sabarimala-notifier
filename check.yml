name: check-slots
on:
  schedule:
    - cron: "*/30 * * * *"   # best-effort; GitHub may delay runs
  workflow_dispatch:
    inputs:
      test:
        description: Send a test Telegram message and exit
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python notifier.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ inputs.test && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe/
      - name: Save state
        run: |
          git config user.name "notifier-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "state" && git push)
